<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trarrr</title>
<style>
:root{--bg:#050507;--fg:#f2f2f5;--muted:#8b8b96;--accent:#8b5cf6;--accent2:#ec4899;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;position:relative}
.bg{position:fixed;inset:0;background:radial-gradient(60% 50% at 20% 20%,rgba(139,92,246,.35),transparent 70%),radial-gradient(55% 45% at 80% 80%,rgba(236,72,153,.28),transparent 70%),#050507;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{filter:hue-rotate(25deg) brightness(1.15)}}
#enter{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(5,5,7,.88);backdrop-filter:blur(14px);cursor:pointer;transition:opacity .7s,visibility .7s}
#enter span{font-size:1.1rem;letter-spacing:.12em;color:var(--muted);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#enter.hide{opacity:0;visibility:hidden}
main{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(380px,100%);padding:36px 28px 28px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .8s .25s,transform .8s .25s}
body.in .card{opacity:1;transform:none}
.avatar{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 36px rgba(139,92,246,.5)}
h1{font-size:1.6rem;letter-spacing:.02em}
.tag{margin-top:6px;color:var(--muted);font-size:.9rem;min-height:1.3em}
.tag::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.links{margin-top:26px;display:flex;justify-content:center;gap:14px}
.links a{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.links a:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 24px rgba(139,92,246,.4)}
.links svg{width:26px;height:26px;fill:currentColor}
.views{margin-top:24px;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="bg"></div>
<div id="enter"><span>click to enter...</span></div>
<main>
  <div class="card">
    <div class="avatar">T</div>
    <h1>Trarrr</h1>
    <p class="tag" id="tag"></p>
    <div class="links">
      <a href="https://youtube.com/@trarrrfuntime?si=YkflHUKpj_DdPGRZ" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>
      </a>
      <a href="https://discord.gg/m7jFNvuaKX" target="_blank" rel="noopener" aria-label="Discord server">
        <svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0-2.4-4.8A5 5 0 0 1 14 8a5 5 0 0 1-.4 2A3 3 0 0 0 16 11zM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.7 0-8 1.300-8 4v2h16v-2c0-2.700-5.300-4-8-4zm8 0c-.3 0-.7 0-1 .1 1.200.9 2 2 2 3.900v2h7v-2c0-2.700-5.300-4-8-4z"/></svg>
      </a>
      <a href="https://discord.com/users/1353335067182764077" target="_blank" rel="noopener" aria-label="Discord">
        <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18.3 18.3 0 0 0-6.4 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 -.2 13.5.2 18a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.300.7-2 1l1.300 2.100a19.900 19.900 0 0 0 6-3c.5-5.200-.8-9.700-3.500-13.600zM8.100 15.300c-1.200 0-2.200-1.100-2.200-2.400s1-2.400 2.200-2.400 2.200 1.100 2.200 2.400-1 2.400-2.200 2.400zm7.800 0c-1.200 0-2.200-1.100-2.200-2.400s1-2.400 2.200-2.400 2.200 1.100 2.200 2.400-1 2.400-2.200 2.400z"/></svg>
      </a>
    </div>
    <p class="views">👁 <span id="v">1</span> profile views</p>
  </div>
</main>
<script>
var text="youtube • discord", i=0, t=document.getElementById("tag");
function type(){ if(i<=text.length){ t.firstChild ? t.firstChild.nodeValue=text.slice(0,i) : t.appendChild(document.createTextNode(text.slice(0,i))); i++; setTimeout(type,90);} }
document.getElementById("enter").addEventListener("click",function(){
  this.classList.add("hide"); document.body.classList.add("in"); setTimeout(type,700);
});
try{ var n=parseInt(localStorage.getItem("views")||"0",10)+1; localStorage.setItem("views",n); document.getElementById("v").textContent=n; }catch(e){}
</script>
</body>
</html>
